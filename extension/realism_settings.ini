; CSP Lua realism ecosystem switches.
; 1 = enabled, 0 = disabled. Restart the session after changing this file.
; Keep this file identical for every participant in a checked online event.

[REALISM]
; Random engine faults and abuse-related reliability stress.
ENGINE_RELIABILITY=1
; Period throttle-linkage response shaping.
THROTTLE_RESPONSE=1
; Engine temperature, radiator or air cooling, shutters, overheating and heat power loss. Collision cooling damage additionally requires COLLISION_DAMAGE_EFFECTS.
THERMAL_SYSTEM=1
; Oil quantity, pressure, consumption, leaks, pump damage and manual pumping.
OIL_SYSTEM=1
; Fuel-tank damage/leaks, starvation and optional manual tank pressurisation.
FUEL_SYSTEM=1
; Starter, stalling and bump-starting.
STARTER_AND_STALL=1
; Battery/generator charge, faults, damage and electrical repairs.
ELECTRICAL_SYSTEM=1
; Non-synchro, dogbox, preselector/Cotal logic and gearbox failures.
TRANSMISSION_SYSTEM=1
; Tyre wear, punctures and carried spare wheels. Collision blowouts additionally require COLLISION_DAMAGE_EFFECTS.
TYRE_SYSTEM=1
; Brake wear, fade and brake-blanking thermal effects. Collision brake failure additionally requires COLLISION_DAMAGE_EFFECTS.
BRAKE_SYSTEM=1
; Turbo/supercharger operation, boost faults and boost-related damage.
FORCED_INDUCTION_SYSTEM=1
; Lua-added collision damage: cooling/brakes, fuel/oil leaks, tyre blowouts,
; electrical and air-cooling hardware damage, engine protection and fire state.
; Vanilla Assetto Corsa collision damage remains active.
COLLISION_DAMAGE_EFFECTS=1
; Mechanical incidents and limp/retirement behaviour for AI-controlled cars.
AI_RELIABILITY=1

[SERVICES]
; All custom pit/roadside repairs, including CVR Pit Crew integration.
PIT_AND_ROADSIDE_REPAIRS=1
; Extra P rescue-push assistance for a nearly stationary car.
RESCUE_PUSH_INTERACTION=1

[RACE_CONTROL]
; Multiplies background random failure likelihood: spark plugs, fuel pump,
; valves, oil pressure, gearbox, generator, forced induction, tyre punctures
; and air-cooled fan-belt stress. 1.00 keeps the car parameters unchanged;
; below 1.00 makes cars more durable and above 1.00 makes failures more likely.
; Collision damage, wear and other driver-abuse consequences are not scaled.
RACE_LENGTH=1.00
; In a race, returning to pits by teleport ends this car's Lua race attempt
; by preventing a restart. Set to 0 to allow a normal restart after teleporting.
TELEPORT_TO_PITS_DNF=1

[FEEDBACK]
; On-screen Lua messages for failures, servicing and system state.
OVERHEAD_MESSAGES=1
; Steam, forced-induction smoke and engine-fire particle effects.
VISUAL_EFFECTS=1
; Wilson preselector gearbox click sounds when that gearbox is selected.
PSG_AUDIO=1

[DEVELOPMENT]
; Verbose diagnostics in the Lua Debug app and CSP Lua log.
DEBUG_LOGGING=1
